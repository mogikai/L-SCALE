[package]
name = "mogi_sleigh"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = { version = "0.1.40", features = ["release_max_level_trace"] }
thiserror = "2.0.3"
ariadne = "0.5.0"
num = "0.4.3"
strum_macros = "0.26.4"
mogi_utilities = { path = "../utilities", version = "*", features = ["serde"] }
imbl = "3.0.0"
petgraph = "0.7.0"
serde-big-array = "0.5.1"
fnv = "1.0.7"
serde = "1.0.217"
serde_derive = "1.0.217"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
brotli = "7.0.0"
mogi_sleigh_parser = { path = "../sleigh_parser", version = "*" }
itertools = "0.14.0"
addr_align = "0.1.0"
bon = "3.6.3"
criterion = "0.5.1"

[features]
trace_build = []
serde = []
trace_pp = ["mogi_sleigh_parser/trace_pp"]
trace_jir = []
trace_resolve = []
trace_match = []
trace_opt = []
default = ["serde"]

[dev-dependencies]
mogi_sleigh = { path = ".", features = ["trace_build"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[[bench]]
name = "sleigh_benches"
harness = false
