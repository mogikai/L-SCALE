[package]
name = "mogi_sleigh"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = { version = "0.1.40", features = ["release_max_level_trace"] }
slotmap = "1.0.*"
thiserror = "2.0.3"
ariadne = "0.5.0"
chumsky = { features = ["pratt"], git = "https://github.com/zesterer/chumsky.git" }
string-interner = "0.18.0"
num = "0.4.3"
strum_macros = "0.26.4"
itertools = "0.13.0"
mogi_utilities = { path = "../utilities", version = "*" }
imbl = "3.0.0"

[features]
trace_build = []
trace_pp = []
trace_jir = []

[profile.test]
opt-level = 3

[dev-dependencies]
mogi_sleigh = { path = ".", features = ["trace_build"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }