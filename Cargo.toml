[package]
name = "fuzzyemu"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
static_assertions = "1.*"
unicorn-engine = { path = "deps/unicorn" }
byteorder = "1.*"
num_enum = "0.*"
goblin = "0.*"
linux-libc-auxv = "0.2.*"
libc = "0.2.126"
iced-x86 = "1.17.*"
log = "*"
pretty_env_logger = "*"
bitflags = "1.*"