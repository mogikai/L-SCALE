[build]
rustflags = ["-Z", "threads=8"]

[workspace]
members = [
    "emulator",
    "derive",
    "fuzzer",
    #    "gui",
    "samples",
    "cpu_legacy",
    "mem",
    "utilities",
    "system",
    "cpu",
    "sleigh",
    "sleigh_parser",
]

exclude = [
    "deps",
    "cpu_legacy/Ghidra"
]

resolver = "2"

[profile.dev.package.cranelift]
opt-level = 3
debug = false

[profile.dev.package.cranelift-codegen]
opt-level = 3
debug = false

[profile.dev.package.cranelift-jit]
opt-level = 3
debug = false

[profile.dev.package.cranelift-module]
opt-level = 3
debug = false

[profile.dev.package.cranelift-native]
opt-level = 3
debug = false

[profile.dev.package.mogi_sleigh]
opt-level = 3
debug = true

[profile.dev.package.mogi_sleigh_parser]
opt-level = 3
debug = true

[profile.test.package.mogi_sleigh]
opt-level = 3
debug = true

#[profile.test.package.mogi_neocpu]
#opt-level = 0

[profile.release-with-debug]
inherits = 'release'
opt-level = 3
debug = true
