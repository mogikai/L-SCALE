[workspace]
members = [
    "emulator",
    "derive",
    "fuzzer",
    #    "gui",
    "samples",
    "cpu",
    "mem",
    "utilities", "system"]

exclude = [
    "deps",
    "cpu/Ghidra"
]

resolver = "2"

[profile.dev.package.cranelift]
opt-level = 3
debug = false

[profile.dev.package.cranelift-codegen]
opt-level = 3
debug = false

[profile.dev.package.cranelift-jit]
opt-level = 3
debug = false

[profile.dev.package.cranelift-module]
opt-level = 3
debug = false

[profile.dev.package.cranelift-native]
opt-level = 3
debug = false