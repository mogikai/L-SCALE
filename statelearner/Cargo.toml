[package]
name = "mogi_statelearner"
version = "0.1.0"
edition = "2024"
license = "MIT or Apache-2.0"

[dependencies]
slotmap = { version = "1.0.7", features = ["serde"] }
petgraph = { version = "0.8.1", features = ["serde-1"] }
thiserror = "2.0.12"
ansi_term = "0.12.1"
itertools = "0.14.0"
rand = "0.10.0"
fnv = "1.0.7"
serde = { version = "1.0.219", features = ["derive"], optional = true }
log = "0.4.27"

[features]
default = ["serde"]
