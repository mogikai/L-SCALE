[package]
name = "fuzzyfuzz"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fuzzyemu = { path = "../emulator", features = ["serde"] }
pretty_env_logger = "*"
log = "*"
clap = { version = "4.4.3", features = ["derive"] }
hex = { version = "0.4.3", features = [] }
rand = "*"
serde = { version = "1.0.*", features = ["derive"] }
petgraph = { version = "*", features = ["serde"] }
ctrlc = "*"
thiserror = "*"
slotmap = { version = "*", features = ["serde"] }

[profile.release]
opt-level = 3
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"