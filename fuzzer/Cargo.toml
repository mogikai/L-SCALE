[package]
name = "mogi_fuzzer"
version = "0.1.0"
edition = "2024"
license = "MIT or Apache-2.0"
repository = "https://github.com/mogikai/mogi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mogi_system = { path = "../system", version = "0.1.0" }
mogi_utilities = { path = "../utilities", features = ["serde"] }
mogi_emulator = { path = "../emulator", features = ["serde"] }
bon = "3.6.4"
tracing = "*"
clap = { version = "4.5.40", features = ["derive"] }
rand = { version = "0.10.0",features = ["chacha"] }
serde = { version = "1.0.*", features = ["derive"] }
serde_json = { version = "1.*" }
thiserror = "*"
slotmap = { version = "*", features = ["serde"] }
parking_lot = "*"
core_affinity = "*"
crossbeam = "0.*"
mogi_statelearner = { path = "../statelearner", version = "0.1.0" }
fast-tlsh = "0.1.8"
zerocopy = "0.9.0-alpha.0"
strum_macros = "0.27.1"
strum = "0.27.1"
clap_complete = "4.5.55"

[features]
default = ["serde"]
serde = []
