[package]
name = "mogi_fuzzer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mogi_cpu = { path = "../cpu", version = "0.1.0" }
mogi_mem = { path = "../mem", version = "0.1.0" }
mogi_utilities = { path = "../utilities", features = ["serde"] }
mogi_emulator = { path = "../emulator", features = ["serde"] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
clap = { version = "4.4.3", features = ["derive"] }
hex = { version = "0.4.3", features = [] }
rand = "*"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = { version = "1.*" }
petgraph = { version = "*", features = ["serde-1"] }
ctrlc = "*"
thiserror = "*"
slotmap = { version = "*", features = ["serde"] }
graphviz-rust = "0.7.0"
parking_lot = "*"
core_affinity = "*"
crossbeam = "0.*"
arrayvec = "0.7.4"
rand_pcg = "0.3.1"
hilbert_curve = "0.2.0"
bmp = "0.5.0"

[profile.release]
opt-level = 3
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
