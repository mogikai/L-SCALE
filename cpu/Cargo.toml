[package]
name = "mogi_cpu"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.*"
addr_align = "0.1.0"
cranelift = "0.106.0"
cranelift-codegen = "0.106.0"
cranelift-jit = "0.106.0"
cranelift-module = "0.106.0"
cranelift-native = "0.106.0"
addr2line = "0.21.0"
bitflags = "2.3.3"
mogi_mem = { path = "../mem" }
target-lexicon = "0.12.11"
tracing = { version = "0.1.37", default-features = false }
object = { version = "0.32.2", default-features = false, features = ["read_core", "elf", "pe"] }
bytemuck = "1.13.1"
hashbrown = "0.14.3"
half = "2.3.1"
memoffset = "0.9.0"
serde = { version = "1.0.197", features = ["derive"] }
serde-xml-rs = "0.6.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
quickcheck = { version = "1.0.3", default-features = false }
