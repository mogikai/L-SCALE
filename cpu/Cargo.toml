[package]
name = "mogi_cpu"
version = "0.1.0"
edition = "2024"
license = "MIT or Apache-2.0"

[dependencies]
dynasmrt = "3.0.1"
thiserror = "2.0.3"
mogi_utilities = { path = "../utilities", version = "0.1.0" }
mogi_system = { path = "../system", version = "*" }
mogi_sleigh = { path = "../sleigh", version = "0.1.0", features = [] }
mogi_mem = { path = "../mem" }
tracing = { version = "0.1.37", default-features = false }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
clap = { version = "4.5.18", features = ["derive"] }
bitvec = "1.0.1"
num_enum = "0.7.3"
num-traits = "0.2.19"
memmap2 = "0.9.5"
libc = "0.2.159"
fnv = "1.0.7"
zerocopy = { version = "0.9.0-alpha.0", features = ["std"] }
ansi_term = "0.12.1"
either = "1.15.0"
strum = { version = "0.27.1", features = ["derive"] }
itertools = "0.14.0"
addr_align = "0.1.0"
criterion = "0.6.0"
goblin = "0.10.0"

[features]
default = ["trace_jit"]
trace_jit = []
trace_emit = []
trace_lru = []
trace_tlb = []
trace_regalloc = []
trace_opt = ["mogi_sleigh/trace_opt"]
trace_jir = ["mogi_sleigh/trace_jir"]
trace_build = ["mogi_sleigh/trace_build"]

[[bench]]
name = "cpu_benches"
harness = false
