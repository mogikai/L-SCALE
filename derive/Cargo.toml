[package]
name = "mogi_derive"
version = "0.1.0"
edition = "2021"
authors = ["The Mogi Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlgiraud/mogi"
description = "A set of utilities used by different parts of the FUZE emuator"
readme = "README.md"
keywords = ["emulation", "derive", "mogi"]
exclude = [".idea"]

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
do_not_compile_unfinished = []
panic_on_unfinished = []

[dependencies]
syn = { version = "*", features = ["full"] }
quote = "*"
proc-macro2 = "*"
