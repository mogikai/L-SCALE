[package]
name = "fuzzyemu"
version = "0.1.0"
edition = "2021"
authors = [
    "Mark Leon Giraud <mark.giraud@iosb.fraunhofer.de>",
]
license-file = "LICENSE"
repository = "https://gitlab.cc-asp.fraunhofer.de/fuzzing/fuzzyemu/fuzzyemu"
rust-version = "1.72"
#description = "TODO"
readme = "README.md"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
rand = "0.8.5"
mockall = "*"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
samples = { path = "../samples" }

[dependencies]
fuzzyemu-derive = { path = "../emulator-derive" }
itertools = "0.12.*"
static_assertions = "1.*"
unicorn-engine = { path = "../deps/unicorn" }
byteorder = "1.*"
num_enum = "0.7.*"
goblin = "0.*"
libc = "0.2.*"
iced-x86 = "1.20.*"
tracing = "*"
bitflags = "2.*"
enumset = "1.1.*"
hexdump = "0.1.*"
thiserror = "1.*"
generational-arena = "0.2.8"
imbl = "2.0.*"
derive_more = { version = "0.99.*", features = ["add"] }
hex = "0.4.*"
size_format = "1.0.*"
serde = { version = "1.0.189", features = ["derive"], optional = true }
bitvec = "1.0.1"
im-rc = "15.1.0"

[features]
serde = ["dep:serde"]
do_not_compile_unfinished = ["fuzzyemu-derive/do_not_compile_unfinished"]
panic_on_unfinished = ["fuzzyemu-derive/panic_on_unfinished"]

[profile.dev.package.unicorn-engine]
opt-level = 0
debug = "full"

[profile.release]
opt-level = 3
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
