[package]
name = "fuzzyemu"
version = "0.1.0"
edition = "2021"
authors = [
    "Mark Leon Giraud <mark.giraud@iosb.fraunhofer.de>",
]
license-file = "LICENSE"
repository = "https://gitlab.cc-asp.fraunhofer.de/fuzzing/fuzzyemu/fuzzyemu"
rust-version = "1.72"
#description = "TODO"
readme = "README.md"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
rand = "0.8.5"
mockall = "*"

[dependencies]
fuzzyemu-derive = { path = "../emulator-derive" }
itertools = "0.11.0"
static_assertions = "1.*"
unicorn-engine = { path = "../deps/unicorn" }
byteorder = "1.*"
num_enum = "0.7.1"
goblin = "0.*"
libc = "0.2.126"
iced-x86 = "1.19.0"
log = "*"
pretty_env_logger = "*"
bitflags = "2.*"
enumset = "1.0.11"
hexdump = "0.1.1"
thiserror = "1.*"
generational-arena = "0.2.8"
imbl = "2.0.3"
derive_more = { version = "0.99.0", features = ["add"] }
hex = "0.4.3"
size_format = "1.0.2"
serde = { version = "1.0.189", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[profile.dev.package.unicorn-engine]
opt-level = 3
debug = "none"

[profile.release]
opt-level = 3
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"